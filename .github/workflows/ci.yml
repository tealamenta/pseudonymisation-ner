name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Tests (unitaires, API, stockage, recherche)
        run: pytest --cov=pseudo_ner --cov-report=term-missing --ignore=tests/test_regression.py
      - name: Entraînement spaCy, évaluation sur valeurs jamais vues, non-régression
        run: |
          pseudo-ner generate --n 600
          pseudo-ner train spacy --out models/spacy --epochs 8
          pseudo-ner evaluate spacy --model-dir models/spacy --report reports/spacy.json --register
          pytest tests/test_regression.py -k spacy
      - name: Promotion, image Docker et manifestes
        if: matrix.python-version == '3.12'
        run: |
          pseudo-ner registry promote spacy
          pseudo-ner registry list
          docker build -t pseudo-ner:ci .
          docker run --rm -d --name ci-api -p 8000:8000 pseudo-ner:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          docker rm -f ci-api
          docker compose config --quiet
