# Image publiée sur le registre GitHub à chaque étiquette "model-<version>" :
#   pseudo-ner registry promote spacy && git tag model-$(python -c "import json;print(json.load(open('models/current.json'))['version'])") && git push --tags
# L'image porte la version du modèle promu ; /health la renvoie.
name: Release

on:
  push:
    tags: ["model-*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Modèle (entraînement reproductible, graine fixe) et registre
        run: |
          pip install -e ".[dev]"
          pseudo-ner generate --n 600
          pseudo-ner train spacy --out models/spacy --epochs 8
          pseudo-ner evaluate spacy --model-dir models/spacy --report reports/spacy.json --register
          pseudo-ner registry promote spacy
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
