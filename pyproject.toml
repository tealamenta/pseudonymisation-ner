[project]
name = "pseudonymisation-ner"
version = "0.1.0"
description = "Pseudonymisation de décisions de justice : NER (spaCy, Flair, CamemBERT), post-traitement, évaluation, API, recherche."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Horache" }]
dependencies = [
    "spacy>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
flair = ["flair>=0.13", "torch>=2.0"]
camembert = ["transformers>=4.40", "datasets>=2.18", "torch>=2.0", "sentencepiece", "protobuf"]
search = ["elasticsearch>=8.0", "pymongo>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "mongomock",
    "pre-commit",
    "pyyaml",
    "types-PyYAML",
]

[project.scripts]
pseudo-ner = "pseudo_ner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pseudo_ner"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
packages = ["pseudo_ner"]
mypy_path = "src"
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
